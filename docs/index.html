    <script>
      /*
       * Runs before first paint so a reader who chose dark never sees the page
       * flash light. Everything here is guarded: a browser with storage denied
       * still gets the system preference, which is the honest default.
       */
      (function () {
        try {
          var stored = window.localStorage.getItem('glyphy-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* Storage is a convenience. Without it the media query decides. */
        }
      })();
    </script>
