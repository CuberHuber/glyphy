# The gate, run on every pull request.
#
# This is deliberately the same two commands as the `merge` script in
# .rultor.yml. Rultor is what actually guards main — a maintainer types
# `@rultor merge` and nothing reaches main unless the gate exits zero. This
# workflow does not replace that. It runs the identical gate earlier, so a
# pull request is already known-green before anyone asks rultor to merge it,
# and a red run here means a red merge there.
#
# Node 20 and 22: 20 is the floor package.json asks for, 22 is what rultor
# and the release workflow run. Both are covered because the pull request
# template promises they are.
#
# Keep this in step with rultor. If `verify` grows a step, both get it.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Report both, rather than hiding 22 behind a failure on 20.
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Actions are pinned to commit SHAs, not tags. A tag can be moved; a
      # commit cannot.
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # format:check, lint, typecheck, test:coverage, build, publint.
      - name: Verify
        run: npm run verify

      # Kept on failure too — a failed coverage floor is exactly when the
      # report is worth reading.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
