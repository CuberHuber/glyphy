# Rultor — the merge and release bot.
#
# Most JavaScript projects have never met rultor, so: it is a chatbot that owns
# the write access to main. A maintainer comments `@rultor merge` on a pull
# request and rultor checks the branch out in a container, runs the script
# below, and only fast-forwards main if it exits zero. Nobody, including the
# maintainer, pushes to main by hand — which is the point.
#
# Docs: https://doc.rultor.com

architect:
  - CuberHuber

# The container the scripts run in. Anything with Node 22 will do.
docker:
  image: node:22-bookworm

# No assets. There was an encrypted .npmrc here holding a long-lived npm
# token, decrypted into the container on every run. Nothing publishes from
# rultor any more, so nothing needs it — and an unused credential that still
# gets decrypted on every merge is strictly worse than no credential.
#
# Revoke that token on npmjs.com and delete .npmrc.asc from glyphy-secrets.

# Runs on `@rultor merge`. Exactly the gate CI runs, so a green pull request
# and a green merge mean the same thing.
merge:
  script: |
    npm ci
    npm run verify

# Releasing moved to GitHub Actions — see .github/workflows/release.yml.
#
# This is not a change of heart about who owns main. Rultor still guards it,
# and a release is still a version a human states out loud rather than one a
# script infers; it is stated in the Actions tab now instead of a comment.
#
# It moved because npm trusted publishing mints its credential from GitHub's
# OIDC issuer, and only GitHub Actions and GitLab CI can present one. Keeping
# the release here would mean keeping a long-lived npm token in
# glyphy-secrets and decrypting it into this container on every release —
# which is the exact credential trusted publishing exists to abolish. There
# is now no npm token anywhere.
#
# `@rultor merge` and `@rultor deploy` are unchanged.

# Runs on `@rultor deploy`. Rebuilds the kit page into docs/, which is what
# GitHub Pages serves. See PAGES.md — the folder is committed on purpose, so
# this only has to prove the build is reproducible from a clean checkout.
deploy:
  script: |
    npm ci
    npm run build:pages
    git diff --exit-code docs
